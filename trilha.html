<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HistóriaApp - Trilha</title>
    <link rel="stylesheet" href="trilha.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-esquerda">
            <a href="index.html" class="btn btn-voltar">←</a>
            <span class="header-titulo" id="trilha-titulo">Trilha</span>
        </div>
        <div class="header-direita">
            <span class="xp-badge">⚡ <span id="xp-display">0</span></span>
            <span class="nivel-badge">Nv. <span id="nivel-display">1</span></span>
        </div>
    </header>

    <main class="caminho-container">
        <div class="caminho-avatar" id="caminho-avatar">
            <span>⭐</span>
        </div>
        <div class="caminho-trilho" id="caminho-trilho"></div>
    </main>

    <div id="modal-flashcard" class="modal-overlay" style="display: none;">
        <div class="modal-flashcard">
            <div class="flashcard-header">
                <span class="flashcard-contador" id="flashcard-contador">1 de 5</span>
                <button class="flashcard-fechar" id="flashcard-fechar">✕</button>
            </div>
            <div class="flashcard-area">
                <div class="flashcard" id="flashcard">
                    <div class="flashcard-frente">
                        <span class="flashcard-label">Pergunta</span>
                        <p class="flashcard-texto" id="flashcard-frente-texto"></p>
                        <span class="flashcard-toque">Toque para virar</span>
                    </div>
                    <div class="flashcard-verso">
                        <span class="flashcard-label">Resposta</span>
                        <p class="flashcard-texto" id="flashcard-verso-texto"></p>
                        <span class="flashcard-toque">Toque para voltar</span>
                    </div>
                </div>
            </div>
            <div class="flashcard-acoes">
                <button class="btn btn-secundario" id="flashcard-ruim">😰 Não sei</button>
                <button class="btn btn-primario" id="flashcard-bom">😎 Sei bem</button>
            </div>
        </div>
    </div>

    <div id="modal-desafio" class="modal-overlay" style="display: none;">
        <div class="modal-desafio">
            <div class="desafio-header-modal">
                <span class="desafio-titulo-modal">🎯 Desafio Obrigatório</span>
                <span class="desafio-contador" id="desafio-contador">1/5</span>
            </div>
            <div class="desafio-barra">
                <div class="desafio-barra-fill" id="desafio-barra-fill"></div>
            </div>
            <p class="desafio-enunciado" id="desafio-enunciado"></p>
            <div class="desafio-opcoes" id="desafio-opcoes"></div>
            <div class="desafio-feedback" id="desafio-feedback"></div>
            <button class="btn btn-primario btn-grande" id="btn-proximo-desafio" style="display: none;">Próxima</button>
        </div>
    </div>

    <div id="modal-resultado-desafio" class="modal-overlay" style="display: none;">
        <div class="modal-resultado-desafio">
            <div class="resultado-desafio-icon" id="resultado-desafio-icon">🏆</div>
            <h2 id="resultado-desafio-titulo">Parabéns!</h2>
            <p class="resultado-desafio-sub" id="resultado-desafio-sub"></p>
            <div class="resultado-desafio-stats">
                <div class="resultado-stat">
                    <span class="resultado-stat-valor" id="rd-acertou">0</span>
                    <span class="resultado-stat-label">Acertos</span>
                </div>
                <div class="resultado-stat">
                    <span class="resultado-stat-valor" id="rd-xp">0</span>
                    <span class="resultado-stat-label">XP</span>
                </div>
            </div>
            <button class="btn btn-primario btn-grande" id="btn-continuar-trilha">Continuar Trilha →</button>
        </div>
    </div>

    <div id="modal-concluir-aula" class="modal-overlay" style="display: none;">
        <div class="modal-concluir">
            <div class="concluir-icon">🎉</div>
            <h2>Aula Concluída!</h2>
            <p class="concluir-xp" id="concluir-xp">+10 XP</p>
            <p class="concluir-texto" id="concluir-texto"></p>
            <button class="btn btn-primario btn-grande" id="btn-proxima-etapa">Próxima Etapa →</button>
        </div>
    </div>

    <script src="trilhas-data.js"></script>
    <script src="trilha.js"></script>
</body>
</html>
